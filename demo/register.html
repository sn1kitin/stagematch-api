<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Registreren - StageMatch</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Caprasimo&family=Figtree:wght@400;600;700&display=swap">
    <link rel="stylesheet" href="style.css?v=10">
</head>
<body>
<main class="auth">
    <a class="logo" href="index.html">Stage<span>Match</span></a>

    <form id="form" class="panel form">
        <h1>Registreren</h1>
        <div class="field">
            Ik ben een
            <div class="choice">
                <label><input type="radio" name="role" value="student" checked> Student</label>
                <label><input type="radio" name="role" value="company"> Bedrijf</label>
            </div>
        </div>
        <label class="field">Naam <small>of bedrijfsnaam</small><input name="name" required></label>
        <label class="field">E-mail<input type="email" name="email" required></label>
        <label class="field">Wachtwoord <small>minstens 8 tekens</small><input type="password" name="password" required></label>
        <p id="message" class="message"></p>
        <button class="btn">Account maken</button>
    </form>

    <p class="switch">Al een account? <a href="login.html">Inloggen</a></p>
</main>

<script src="api.js?v=4"></script>
<script>
    document.getElementById('form').onsubmit = async (e) => {
        e.preventDefault();
        const form = e.target;

        const json = await api('POST', 'register', {
            name: form.name.value,
            email: form.email.value,
            password: form.password.value,
            role: form.role.value,
        });

        if (json.status !== 201) {
            document.getElementById('message').textContent = errorText(json);
            return;
        }

        alert('Account gemaakt, je kunt nu inloggen.');
        location.href = 'login.html';
    };
</script>
</body>
</html>
