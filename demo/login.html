<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Inloggen - StageMatch</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Caprasimo&family=Figtree:wght@400;600;700&display=swap">
    <link rel="stylesheet" href="style.css?v=10">
</head>
<body>
<main class="auth">
    <a class="logo" href="index.html">Stage<span>Match</span></a>

    <form id="form" class="panel form">
        <h1>Inloggen</h1>
        <label class="field">E-mail<input type="email" name="email" required></label>
        <label class="field">Wachtwoord<input type="password" name="password" required></label>
        <p id="message" class="message"></p>
        <button class="btn">Inloggen</button>
    </form>

    <p class="switch">Nog geen account? <a href="register.html">Registreren</a></p>
</main>

<script src="api.js?v=4"></script>
<script>
    document.getElementById('form').onsubmit = async (e) => {
        e.preventDefault();
        const form = e.target;

        const json = await api('POST', 'login', {
            email: form.email.value,
            password: form.password.value,
        });

        if (json.status !== 200) {
            document.getElementById('message').textContent = errorText(json);
            return;
        }

        saveLogin(json.data.token, json.data.user);
        location.href = homeFor(json.data.user);
    };
</script>
</body>
</html>
